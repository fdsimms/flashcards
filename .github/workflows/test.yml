name: Tests

on:
  pull_request:
  # Also on main: a branch is only as green as the main it was cut from, and nothing else
  # would notice a merge that left main red.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR pushes are worth cancelling. Merges land close together, and cancelling a
  # main run lets a merge that broke main have its run killed by the next one and never show red.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tests build the app's unicase collation (modules/anki-unicase) as a SQLite extension,
      # which needs SQLite's headers; tests/support/unicase.ts fails the run in CI without them.
      - name: SQLite headers for the unicase extension
        run: test -f /usr/include/sqlite3ext.h || (sudo apt-get update && sudo apt-get install -y libsqlite3-dev)
      - run: npx tsc --noEmit
      # In UTC+14 rather than the runner's UTC, because UTC is the one zone where a UTC/local
      # mix-up (a day key cut out of toISOString(), a `...Z` fixture read back as a local date)
      # cannot fail. Local runs already cover UTC; `npm run test:tz` covers two more zones.
      #
      # Shuffled, because a test that leans on the one before it passes in declaration order and
      # in no other. Vitest prints the seed on a failure; `--sequence.seed=<n>` replays it.
      - run: npx vitest run --sequence.shuffle
        env:
          TZ: Pacific/Kiritimati
      # The slowest step, and it only catches bundle-time breakage (a bad import path, a missing
      # asset, a native config change). On PRs it runs only when a path that can cause that
      # changed; on main it always runs, since that's the build every branch is cut from.
      - name: Check for bundle-relevant changes
        if: github.event_name == 'pull_request'
        id: bundle-paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bundle:
              - 'package.json'
              - 'package-lock.json'
              - 'app.json'
              - 'eas.json'
              - 'src/app/**'
              - 'plugins/**'
              - 'modules/**'
              - 'assets/**'
      - if: github.event_name != 'pull_request' || steps.bundle-paths.outputs.bundle == 'true'
        run: npx expo export --platform ios --output-dir /tmp/expo-export
        env:
          CI: 1

  # The MCP (server/mcp), against a real Anki sync server from the same `anki` package. Its own
  # job so the app's checks don't wait on pip, and only when something it reads changed.
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for MCP changes
        if: github.event_name == 'pull_request'
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mcp:
              - 'server/mcp/**'
              - 'server/speech/**'
              # tests/test_anki_version.py reads ANKI_VERSION from it.
              - 'server/docker-compose.yml'
              - 'tests/fixtures/anki/**'
              - '.github/workflows/test.yml'
      - if: github.event_name != 'pull_request' || steps.paths.outputs.mcp == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/mcp/requirements*.txt
      - if: github.event_name != 'pull_request' || steps.paths.outputs.mcp == 'true'
        # The shared Azure client (server/speech) is a package of its own.
        run: pip install -r server/mcp/requirements-dev.txt ./server/speech
      - if: github.event_name != 'pull_request' || steps.paths.outputs.mcp == 'true'
        run: python -m pytest -q
        working-directory: server/mcp
        env:
          TZ: Pacific/Kiritimati

  # Read & Listen's server (server/reader), and the Azure client it shares with the MCP
  # (server/speech): lint, types and tests, the sync tests against a real Anki sync server from the
  # same `anki` package. Only when something it reads changed.
  reader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/reader
    steps:
      - uses: actions/checkout@v4
      - name: Check for reader changes
        if: github.event_name == 'pull_request'
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            reader:
              - 'server/reader/**'
              - 'server/speech/**'
              # tests/test_anki_version.py reads ANKI_VERSION from it.
              - 'server/docker-compose.yml'
              - '.github/workflows/test.yml'
      - if: github.event_name != 'pull_request' || steps.paths.outputs.reader == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: server/reader/uv.lock
      - if: github.event_name != 'pull_request' || steps.paths.outputs.reader == 'true'
        run: uv sync --frozen
      - if: github.event_name != 'pull_request' || steps.paths.outputs.reader == 'true'
        run: uv run ruff check . ../speech && uv run ruff format --check . ../speech && uv run mypy && uv run mypy ../speech
      - if: github.event_name != 'pull_request' || steps.paths.outputs.reader == 'true'
        run: uv run pytest -q && uv run pytest -q ../speech/tests
        env:
          TZ: Pacific/Kiritimati
