[project]
name = "franki-speech"
version = "0.1.0"
description = "Azure text to speech for the server's Python services (the MCP and Read & Listen)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Word timings (`SpeechClient.speak`), which only Azure's Speech SDK gives. Read & Listen installs
# it; the MCP, which only records audio, doesn't need it. Without it, `speak` records with no timings.
timings = ["azure-cognitiveservices-speech>=1.53"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["franki_speech"]

# Checked with Read & Listen's tools (server/reader): cd ../reader && uv run ruff check ../speech
[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

