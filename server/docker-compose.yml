# The Anki sync server behind Caddy, which gets and renews an HTTPS certificate on its own.
# Settings come from .env (copy .env.example). Start with: docker compose up -d --build
# The MCP (mcp/, for Claude) runs too when .env's COMPOSE_PROFILES has mcp, and Read & Listen
# (reader/) when it has reader.
services:
  anki:
    build:
      context: .
      args:
        ANKI_VERSION: ${ANKI_VERSION:-26.09.4}
    restart: unless-stopped
    environment:
      SYNC_USER1: "${ANKI_USER}:${ANKI_PASSWORD}"
      # Anki's default is 100 MB, below what a collection with years of reviews can reach.
      MAX_SYNC_PAYLOAD_MEGS: "${MAX_SYNC_PAYLOAD_MEGS:-500}"
    volumes:
      - anki-data:/data
  mcp:
    # From this folder, so the MCP and Read & Listen can both copy the shared speech/ package.
    build:
      context: .
      dockerfile: mcp/Dockerfile
    profiles: [mcp]
    restart: unless-stopped
    environment:
      MCP_PUBLIC_URL: "https://${DOMAIN}"
      MCP_PASSWORD: ${MCP_PASSWORD:-}
      ANKI_SYNC_ENDPOINT: "http://anki:8080/"
      ANKI_USER: ${ANKI_USER}
      ANKI_PASSWORD: ${ANKI_PASSWORD}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-}
      # Read & Listen's server, for its costs (read_and_listen_costs); unused while it's off.
      READER_URL: "http://reader:8080"
      READER_PASSPHRASE: ${READER_PASSPHRASE:-}
    volumes:
      - mcp-data:/data
    depends_on:
      - anki
  reader:
    build:
      context: .
      dockerfile: reader/Dockerfile
    profiles: [reader]
    restart: unless-stopped
    environment:
      READER_DB_PATH: /data/reader.db
      READER_AUDIO_DIR: /data/audio
      READER_ANKI_DIR: /data/anki
      ANKI_SYNC_ENDPOINT: "http://anki:8080/"
      ANKI_USER: ${ANKI_USER}
      ANKI_PASSWORD: ${ANKI_PASSWORD}
      APP_PASSPHRASE: ${READER_PASSPHRASE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-}
      # Thai's two voices, when not the defaults (Spanish's are set in reader/.../languages.py).
      AZURE_VOICE_A: ${AZURE_VOICE_A:-}
      AZURE_VOICE_B: ${AZURE_VOICE_B:-}
      # Backups (optional): an S3-compatible bucket Litestream streams the database to.
      BUCKET_NAME: ${READER_BUCKET_NAME:-}
      AWS_ENDPOINT_URL_S3: ${READER_BUCKET_ENDPOINT:-}
      AWS_REGION: ${READER_BUCKET_REGION:-}
      AWS_ACCESS_KEY_ID: ${READER_BUCKET_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${READER_BUCKET_SECRET:-}
    volumes:
      - reader-data:/data
    # A server that stops answering shows as unhealthy, and update.sh's timer restarts it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    depends_on:
      - anki
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - anki
volumes:
  anki-data:
  mcp-data:
  reader-data:
  caddy-data:
  caddy-config:
