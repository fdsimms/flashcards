# Continuous backup of the database to S3-compatible storage (Tigris, Fly's, where the server ran
# before it moved here), read by start.sh. Keys checked against Litestream v0.5.17's config parser
# (cmd/litestream/main.go). ${...} is expanded from the environment (../.env, through
# docker-compose.yml): BUCKET_NAME, AWS_ENDPOINT_URL_S3 and AWS_REGION, and AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY, which Litestream reads directly.
dbs:
  - path: ${READER_DB_PATH}
    replica:
      type: s3
      bucket: ${BUCKET_NAME}
      # The name the replica was made under (the server was called ailing): a restore looks here.
      path: ailing
      endpoint: ${AWS_ENDPOINT_URL_S3}
      region: ${AWS_REGION}
