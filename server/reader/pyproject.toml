[project]
name = "franki-reader"
version = "0.1.0"
description = "Read & Listen: texts written from the words in your Anki deck"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pythainlp>=5",
    "anthropic>=1",
    # Anki's own engine, to keep a copy of the collection in step with the sync server. Keep it at
    # the version the sync server runs (ANKI_VERSION in ../docker-compose.yml).
    "anki==26.9.4",
    "simplemma>=2.0.0",
    # Azure's text to speech, shared with the MCP (../speech).
    # `timings`: the Speech SDK, for the word timings the reader follows along with.
    "franki-speech[timings]",
    # WaniKani's API, for the vocabulary learned there (wanikani.py).
    "httpx>=0.27",
    # Japanese: splits a line into words and finds each one's dictionary form and reading
    # (japanese.py). The core dictionary is about 70 MB on disk.
    "sudachipy>=0.7",
    "sudachidict-core>=20250825",
]

[tool.uv.sources]
franki-speech = { path = "../speech" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/franki_reader"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
